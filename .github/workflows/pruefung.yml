name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefung:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Datenbank-Tests
        run: npm run test:db
        env:
          LEMURI_TEST_PG: postgres://postgres@127.0.0.1:54329/postgres
